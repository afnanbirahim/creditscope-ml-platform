name: creditscope

services:
  api:
    image: creditscope-api:1.0.0
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      CREDITSCOPE_BATCH_LIMIT: "100"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    networks:
      - creditscope-private

  ui:
    image: creditscope-ui:1.0.0
    build:
      context: .
      dockerfile: Dockerfile.ui
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      CREDITSCOPE_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3).read()
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 5
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    networks:
      - creditscope-private

networks:
  creditscope-private:
    driver: bridge
